// ExoInstruments - LORRI, the reconnaissance imager.
//
// THIS PART IS MEANT TO LEAVE KERBIN ORBIT. The pipeline computes a target's apparent size from
// the observer's real position, so what this instrument is worth is set by how close the player
// is willing to fly it, not by its 21 cm mirror. Price and mass are design decisions, anchored
// on the observatory part's own ratio; no per-unit cost for LORRI is used here.
//
// THE MODEL IS OURS: a bare OTA tube modelled in Fusion, exported to Unity and written out with
// PartTools. Nothing from Tarsier Space Technology is left in this folder.
//
// WHAT THE MODEL PROVIDES. Four named empties, and the reason they are empties rather than an
// oriented transform is that a modeller working in one axis convention and exporting into another
// gets a rotation wrong silently, where two positions cannot be wrong about the line between them.
//
//   Telescope_end   the entrance pupil, at the mouth of the tube, 1.6 mm inside the rim.
//   Far_away        any point further out along the optical axis. The axis is the difference, so
//                   the module needs neither of them to carry a rotation. It comes out (0, 1, 0),
//                   the tube's own long axis, which is what dump_mu is for.
//   Mounting_base   the flat underside, for a tube strapped to the side of a bus.
//   Mouting_back    the closed end, for a tube stacked on top of one. Spelled as the model spells
//                   it, missing an n, because FindModelTransform matches the string and not the
//                   intent.
//
// NO ANIMATION, and that is correct here rather than an omission: the catalogue entry carries
// HasApertureDoor = false, because the real instrument's cover opens once on the way out and is
// not something an observer operates. A model with a door clip would make the module offer buttons
// for a door this telescope does not have.
//
// Checkable without launching the game:  python3 tools/dump_mu.py model.mu

PART
{
	name = ExoLorri
	module = Part
	author = ExoInstruments

	mesh = model.mu

	// ONE, because this model is built at its real size: 0.654 m of tube along the part's Y, which
	// is the length New Horizons flew. The 0.08667 that used to be here scaled a borrowed 2.4 m
	// observatory mesh down to a 21 cm instrument and has nothing to scale any more.
	rescaleFactor = 1

	// HOW THE PLAYER MOUNTS THIS THING.
	//
	// Syntax is  posX, posY, posZ, dirX, dirY, dirZ, size  with the position in metres in the
	// PART's own frame and the direction pointing out of the part. Size 0 is the 0.625 m bulkhead,
	// the nearest stock diameter above this 0.385 m tube.
	//
	// THE NODES ARE READ OFF THE MODEL'S OWN EMPTIES, in the mesh's LOCAL frame with Unity axes,
	// because KSP resets the root object's transform when it loads a model. Stock shows it plainly:
	// RCSFuelTankR1_01.mu has its root 48 m out in Z and 30 m in Y, and the tank does not appear
	// 57 m from where it is attached. The first two versions applied this model's 90 degree root
	// rotation, which put the stack node first inside the tube and then out on its flank. In the
	// frame KSP actually uses, the tube stands along Y from y = 0.014 to y = 0.668, mouth at the top,
	// and Mouting_back sits 1.6 mm off the bottom face, so the stack node faces -Y.
	node_stack_bottom = 0.0, 0.0156, -0.0078, 0.0, -1.0, 0.0, 0

	// DELIBERATELY NO node_stack_top. The open end of the tube is the pupil, and a stack node there
	// is an invitation to bolt something across the line of sight. RefreshApertureObstruction would
	// duly report it and the telescope would simply never take a clean frame, which is a worse
	// experience than not offering the node at all.

	// The horizontal mount as a stack node too. The editor only draws spheres for node_stack_*
	// entries, so with node_attach alone this mounting point existed but could not be seen.
	node_stack_side = 0.0, 0.1838, -0.1842, 0.0, 0.0, -1.0, 0

	// Surface attachment, so the tube can be strapped to the side of a bus instead of stacked.
	// Mounting_base sits 0.7 mm off the -Z flank, so the normal is -Z and the tube lies along the
	// surface it is attached to.
	node_attach = 0.0, 0.1838, -0.1842, 0.0, 0.0, -1.0, 0

	// stack, srfAttach, allowStack, allowSrfAttach, allowCollision.
	//
	// allowSrfAttach went 0 -> 1 on purpose: this part is meant to be the centrepiece a player
	// builds their own satellite around, so panels, antennas and reaction wheels have to be
	// stickable onto the tube itself. The occlusion check is what punishes putting them in front
	// of the pupil, rather than the editor refusing the attachment outright.
	attachRules = 1,1,1,1,0

	// WHERE THIS SITS IN THE TREE, AND WHY IT IS NOT THE LAST NODE.
	//
	// Stock already ships a space telescope: the SENTINEL Infrared Telescope, in scienceTech
	// (tier 6, 300 science), at an entry cost of 9000. That part is the reference point, because
	// it is the one the player has already bought when they start wanting a bigger mirror.
	//
	// advScienceTech is the node directly above it on the same branch (tier 7, 550 science,
	// reached from scienceTech + fieldScience), and it currently carries one stock part, the
	// GRAVMAX. So the flagship lands one tier past stock's own telescope, on the line the player
	// was already following, in a node thin enough to have room for a headline part.
	//
	// It was on experimentalScience, which is the terminal science node of the whole tree
	// (tier 8, 1000 science). Nothing about a 2.4 m mirror argues for being gated behind the
	// last node in the game; that placement simply meant most careers would never see the part.
	TechRequired = advScienceTech

	// PRICE, FROM THE MOD'S OWN COST LAW. Observatories.cs gives
	// UnlockCostFunds = C (D / 1 m)^(alpha kappa) after van Belle, Meinel and Meinel (2004), and it
	// reproduces every observatory unlock price in the roster to the fund. A PART price takes the
	// space exponent with the GROUND scale, because the player pays to get it up there separately,
	// in the rocket's own part costs: 44000 x 0.208^1.30 is about 4400. The recurring unit stays at
	// the 30% of non-recurring this roster uses throughout.
	entryCost = 4400
	cost = 1300
	category = Science
	subcategory = 0
	title = LORRI Reconnaissance Imager
	manufacturer = ExoInstruments
	description = A 20.8-centimetre Ritchey-Chretien tube and one panchromatic CCD, flown on New Horizons to photograph a world nobody had ever resolved. No filter wheel, no aperture door, and one band from 435 to 870 nanometres is the whole instrument. What makes it worth its mass is not the mirror, which a garden telescope beats, but how far you are willing to fly it: the pipeline works out a target's apparent size from the observer's real position, so this camera is worth exactly the transfer burn you spend on it. Give it attitude control, power and an antenna and you can run it from the observatory instead of flying out to it.

	mass = 0.0086
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 1
	crashTolerance = 8
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 1200
	bulkheadProfiles = size0, srf
	tags = telescope observatory science astronomy lorri newhorizons reconnaissance imaging

	MODULE
	{
		name = ModuleExoSpaceTelescope

		// One detector, one band, no second channel to switch to.
		instrumentName = New Horizons LORRI

		// The two empties that give the optical axis. Named here because the model's names are its
		// own and the module's defaults are optic_pupil and optic_aim.
		opticPupilTransformName = Telescope_end
		opticAimTransformName = Far_away

		// NO apertureOffsetMeters. It is the fallback for a part composed from stock meshes, where
		// the module has to invent a pupil along the part's +Y; this model says where its pupil is,
		// and the two empties above win over it in OnStart.
	}

	// A telescope this size cannot be pointed by a probe core's own torque, and the physics
	// downstream can tell (see PointingStability): without momentum-exchange control the vessel
	// falls back to a thruster limit cycle and every exposure streaks. Wheels are therefore part
	// of the instrument rather than something the player is expected to guess at.
	MODULE
	{
		name = ModuleReactionWheel
		// Scaled off the 2.4 m part's own 12 per 4.5 t rather than pasted from it. Left at Hubble's
		// figure this 8.6 kg camera carried nine times the best stock wheel's torque per tonne, and
		// under its new price it would have been the cheapest good SAS unit in the game.
		PitchTorque = 0.025
		YawTorque = 0.025
		RollTorque = 0.025
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.002
		}
	}

	// NO FlagDecal HERE. It needs a mesh named "flag" to draw onto and the tube has none, so the
	// module would log a lookup failure every time the part is instantiated. Add the quad to the
	// model first, then put the module back.

	// Enough to hold the bus through an eclipse and expose across it, not Hubble's 400.
	RESOURCE
	{
		name = ElectricCharge
		amount = 80
		maxAmount = 80
	}
}
